name: ci-node

# Reusable CI for repos that have no CI of their own (npm or pnpm).
# Runs each script in `scripts` if the project defines it.

on:
  workflow_call:
    inputs:
      package-manager:
        type: string
        default: npm
        description: npm or pnpm
      working-directory:
        type: string
        default: .
      node-version:
        type: string
        default: "22"
      pnpm-version:
        type: string
        default: "10"
        description: pnpm major/version for pnpm/action-setup (used when package-manager is pnpm and package.json has no packageManager field)
      scripts:
        type: string
        default: typecheck lint test build
        description: Space-separated package.json scripts to run when present
      env:
        type: string
        default: ""
        description: Newline-separated KEY=VALUE pairs exported before the scripts run

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
      - name: Export env
        if: inputs.env != ''
        env:
          EXTRA_ENV: ${{ inputs.env }}
        run: printf '%s\n' "$EXTRA_ENV" >> "$GITHUB_ENV"
      - name: Run scripts
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for s in $SCRIPTS; do
            if node -e "process.exit(require('./package.json').scripts?.['$s'] ? 0 : 1)"; then
              echo "::group::$s"
              "$PM" run "$s"
              echo "::endgroup::"
            else
              echo "skip $s (not defined)"
            fi
          done
